const PROV={en:['Alberta','British Columbia','Manitoba','New Brunswick','Newfoundland and Labrador','Northwest Territories','Nova Scotia','Nunavut','Ontario','Prince Edward Island','Quebec','Saskatchewan','Yukon'],
fr:['Alberta','Colombie-Britannique','Manitoba','Nouveau-Brunswick','Terre-Neuve-et-Labrador','Territoires du Nord-Ouest','Nouvelle-Écosse','Nunavut','Ontario','Île-du-Prince-Édouard','Québec','Saskatchewan','Yukon']};
const PCODE=['AB','BC','MB','NB','NL','NT','NS','NU','ON','PE','QC','SK','YT'];
const IMGS=['stone-wide','dark-spark','dark-slate','grey-slate','stone-portrait','wrist','life-cafe','life-laugh'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let lang='en',qty=1,cur=0;
const money=n=>new Intl.NumberFormat(lang==='fr'?'fr-CA':'en-CA',{style:'currency',currency:'CAD'}).format(n);
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}
 document.documentElement.lang=l;const d=T[l];
 $$('[data-i18n]').forEach(e=>e.textContent=d[e.dataset.i18n]);
 $$('[data-alt]').forEach(e=>e.alt=d[e.dataset.alt]);
 $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 const ps=$('#prov'),v=ps.value;ps.innerHTML='<option value="">'+d.choose+'</option>'+PROV[l].map((p,i)=>`<option value="${PCODE[i]}">${p}</option>`).join('');ps.value=v;
 $('#faqs').innerHTML=d.faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
 $$('[data-cfg=email]').forEach(a=>{a.textContent=CONFIG.email;if(a.href)a.href='mailto:'+CONFIG.email});$$('[data-cfg=phone]').forEach(s=>s.textContent=CONFIG.phone);
 buildThumbs();money_();
 $('#sub').textContent=d.o_btn;$$('.er').forEach(e=>{if(e.parentNode.classList.contains('bad'))validate(e.parentNode.querySelector('input,select'))});
 document.title=l==='fr'?'AURÈLE — Le bracelet Spectre | Paiement à la livraison au Canada':'AURÈLE — The Spectrum Bracelet | Cash on delivery in Canada';}
function money_(){$('#up').textContent=money(CONFIG.price);$('#qv').textContent=qty;$('#tot').textContent=money(CONFIG.price*qty+CONFIG.shipping)}
/* gallery */
const gm=$('#gm');
gm.innerHTML=IMGS.map((n,i)=>`<img class="${i?'off':'on'}" src="assets/${n}.jpg" alt="" ${i?'loading="lazy"':''}>`).join('')+'<video class="off" muted loop playsinline preload="none" poster="assets/poster.jpg" src="assets/bracelet.mp4" controls></video>';
function show(i){cur=i;gm.classList.remove('zoom');$$('#gm>*').forEach((e,k)=>{e.className=k===i?'on':'off';e.style.transform='';if(e.tagName==='VIDEO'){k===i?e.play().catch(()=>{}):e.pause()}});
 $$('#gt button').forEach((b,k)=>b.setAttribute('aria-current',k===i));$$('#gm img').forEach((im,k)=>im.alt=T[lang].g[k])}
function buildThumbs(){$('#gt').innerHTML=IMGS.map((n,i)=>`<button aria-label="${T[lang].g[i]}" aria-current="${i===cur}"><img src="assets/${n}.jpg" alt="" loading="lazy"></button>`).join('')+`<button aria-label="${T[lang].g[8]}" aria-current="${cur===8}"><img src="assets/poster.jpg" alt=""><span class="pl">▶</span></button>`;
 $$('#gt button').forEach((b,i)=>b.onclick=()=>show(i));$$('#gm img').forEach((im,k)=>im.alt=T[lang].g[k])}
gm.addEventListener('click',e=>{if(cur<8&&e.target.tagName==='IMG')gm.classList.toggle('zoom')});
gm.addEventListener('mousemove',e=>{if(gm.classList.contains('zoom')){const r=gm.getBoundingClientRect(),i=$('#gm .on');i.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%'}});
/* order */
$('#qm').onclick=()=>{qty=Math.max(1,qty-1);money_()};$('#qp').onclick=()=>{qty=Math.min(CONFIG.maxQty,qty+1);money_()};
const rules={name:v=>v.trim().length>=2||'e_req',phone:v=>/^(\+?1)?\D*\d{3}\D*\d{3}\D*\d{4}$/.test(v.trim())&&v.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'').length===10||(v.trim()?'e_phone':'e_req'),
 province:v=>!!v||'e_req',city:v=>v.trim().length>=2||'e_req',address:v=>v.trim().length>=5||'e_req',
 email:v=>!v.trim()||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim())||'e_email',postal:v=>!v.trim()||/^[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d$/.test(v.trim())||'e_pc'};
function validate(el){const r=rules[el.name];if(!r)return true;const res=r(el.value),f=el.closest('.f'),ok=res===true;f.classList.toggle('bad',!ok);f.querySelector('.er').textContent=ok?'':T[lang][res];el.setAttribute('aria-invalid',!ok);return ok}
$$('#of input,#of select').forEach(el=>el.addEventListener('blur',()=>validate(el)));
const t0=Date.now();
$('#of').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,m=$('#fmsg');m.textContent='';
 const bad=[...f.elements].filter(el=>rules[el.name]&&!validate(el));if(bad.length){bad[0].focus();return}
 const b=$('#sub');b.disabled=true;b.textContent=T[lang].sending;
 const fd=Object.fromEntries(new FormData(f));Object.assign(fd,{quantity:qty,lang,elapsed:Date.now()-t0});
 try{const r=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw 0;
  f.style.display='none';$('#ok').style.display='block';$('#oid').textContent=T[lang].ok_id+j.id;$('#ok').scrollIntoView({behavior:'smooth',block:'center'});
 }catch(x){m.textContent=T[lang].e_net;b.disabled=false;b.textContent=T[lang].o_btn}});
/* language */
$$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let sl;try{sl=localStorage.getItem('lang')}catch(e){}
setLang(sl||((navigator.language||'').toLowerCase().startsWith('fr')?'fr':'en'));
/* nav + bar */
const nav=$('#nav'),bar=$('#bar');
addEventListener('scroll',()=>{nav.classList.toggle('s',scrollY>40);const o=$('#order').getBoundingClientRect();bar.classList.toggle('v',scrollY>innerHeight*.7&&!(o.top<innerHeight&&o.bottom>0))},{passive:true});
/* motion */
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function done(){const p=$('#pre');if(!p)return;if(rm||!window.gsap){p.remove();return}
 gsap.timeline().to('#pre i',{width:180,duration:.9,ease:'power2.inOut'}).to('#pre',{opacity:0,duration:.7,onComplete:()=>p.remove()})
 .from('.hl span',{yPercent:110,duration:1.2,ease:'power4.out',stagger:.15},'-=.3').from('#hero .sub,#hero .cta-row,nav',{opacity:0,y:20,duration:.9,stagger:.12},'-=.7');
 if(window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);
  gsap.utils.toArray('.story img').forEach(i=>gsap.to(i,{yPercent:-12,ease:'none',scrollTrigger:{trigger:i,scrub:true}}));
  gsap.to('#final>img',{yPercent:8,ease:'none',scrollTrigger:{trigger:'#final',scrub:true}});
  gsap.from('.feat div',{opacity:0,y:30,duration:.8,stagger:.12,scrollTrigger:{trigger:'.feat',start:'top 80%'}});
  gsap.from('.life figure',{clipPath:'inset(0 0 100% 0)',duration:1.3,ease:'power3.out',stagger:.2,scrollTrigger:{trigger:'.life',start:'top 75%'}})}}
addEventListener('load',()=>setTimeout(done,500));setTimeout(()=>{if($('#pre'))done()},4000);
if(!rm&&matchMedia('(hover:hover) and (pointer:fine)').matches){
 const c=$('#cur');addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
 $$('a,button,summary,.main').forEach(a=>{a.addEventListener('mouseenter',()=>{c.style.width=c.style.height='38px'});a.addEventListener('mouseleave',()=>{c.style.width=c.style.height='12px'})});
 $$('.mag').forEach(b=>{b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.2}px,${(e.clientY-r.top-r.height/2)*.3}px)`});b.addEventListener('mouseleave',()=>b.style.transform='')})}
/* gold particles */
(function(){if(rm)return;const cv=$('#pt'),x=cv.getContext('2d');let w,h,P=[];
 const rs=()=>{w=cv.width=cv.offsetWidth;h=cv.height=cv.offsetHeight;P=Array.from({length:w<700?25:55},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,v:Math.random()*.25+.05,a:Math.random()}))};rs();addEventListener('resize',rs);
 let on=true;new IntersectionObserver(en=>on=en[0].isIntersecting).observe(cv);
 (function f(){if(on){x.clearRect(0,0,w,h);P.forEach(p=>{p.y-=p.v;p.a+=.01;if(p.y<0)p.y=h;x.fillStyle=`rgba(230,210,162,${.25+.35*Math.abs(Math.sin(p.a))})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()})}requestAnimationFrame(f)})()})();
